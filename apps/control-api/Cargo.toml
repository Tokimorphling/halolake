[package]
name = "halolake-control-api"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
halolake-api-contract = { workspace = true }
halolake-control-plane = { workspace = true }
halolake-control-storage = { workspace = true }
halolake-domain = { workspace = true }
halolake-router-core = { workspace = true }
halolake-telemetry = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "tracing"] }
bcrypt = { workspace = true }
clap = { workspace = true }
certain-map = { workspace = true }
data-encoding = { workspace = true }
http = { workspace = true }
ipnet = { workspace = true }
futures-util = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots", "socks", "stream"] }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
service-async = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["mysql", "postgres", "runtime-tokio-rustls", "sqlite"] }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
webauthn-rs = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }

# Module surface partitioning (see docs/CONTROL_API_MODULES_CN.md).
# Default keeps full new-api frontend compatibility (including stubs).
[features]
default = ["core", "admin-extras", "compat-stubs", "allocator-mimalloc", "embedded-web", "passkey"]
# Always-on product core: auth, users/tokens/channels, options, logs, gateway internal.
core = []
# Optional admin tooling beyond the proxy management core.
admin-extras = ["axum/multipart"]
# Routes that only exist so the copied new-api web does not 404
# (payment / OAuth / subscription / deployment / empty content pages).
compat-stubs = []
allocator-mimalloc = ["dep:mimalloc"]
# Compile the default frontend into the executable for single-file deployments.
embedded-web = []
# WebAuthn/FIDO parsing and crypto are sizeable; lite builds return a clear
# feature-disabled response from the compatibility routes.
passkey = ["dep:webauthn-rs"]

