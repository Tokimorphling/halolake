[workspace]
members = [
    "apps/control-api",
    "apps/gateway-monoio",
    "crates/api-contract",
    "crates/control-plane",
    "crates/control-storage",
    "crates/domain",
    "crates/protocol",
    "crates/relaykit-rs",
    "crates/router-core",
    "crates/telemetry",
]
resolver = "2"

[workspace.package]
authors = ["halolake contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/halolake/halolake"

[workspace.dependencies]
halolake-api-contract = { path = "crates/api-contract" }
halolake-control-plane = { path = "crates/control-plane" }
halolake-control-storage = { path = "crates/control-storage" }
halolake-domain = { path = "crates/domain" }
halolake-protocol = { path = "crates/protocol" }
relaykit = { package = "relaykit-rs", path = "crates/relaykit-rs" }
halolake-router-core = { path = "crates/router-core" }
halolake-telemetry = { path = "crates/telemetry" }

anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false }
bcrypt = "0.19.2"
bytes = "1"
brotli = { version = "3", default-features = false, features = ["std"] }
certain-map = "0.3.1"
clap = { version = "4", default-features = false, features = ["derive", "env", "error-context", "help", "std", "usage"] }
data-encoding = "2"
flate2 = "1"
faststr = { version = "0.2", features = ["serde"] }
futures-util = "0.3"
futures-channel = "0.3"
hmac = "0.12"
http = "1"
ipnet = "2"
reqwest = { version = "0.12", default-features = false }
regex = "1"
ruzstd = "0.9"
monoio = { version = "0.2.4", features = ["sync"] }
monoio-http = { version = "0.3.5", features = ["encoding"] }
monoio-rustls = { version = "0.4.0", default-features = false, features = ["tls12"] }
monoio-transports = { version = "0.5.3", features = ["hyper", "logging", "rustls-unsafe-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service-async = "0.2.3"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false }
thiserror = "1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
toml = { version = "0.8", default-features = false, features = ["display", "parse"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webauthn-rs = { version = "0.6.1-dev", default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation"] }
webpki-roots = "0.26"
mimalloc = { version = "0.1", default-features = false }

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
