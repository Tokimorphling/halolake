[package]
name = "relaykit-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust protocol conversion for OpenAI Chat, Responses, Anthropic Messages, and Gemini"
license = "AGPL-3.0-only"
readme = "README.md"
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE", "UPSTREAM"]

[lib]
name = "relaykit"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "arbitrary_precision"] }
